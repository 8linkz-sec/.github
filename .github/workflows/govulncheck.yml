name: Go Vulnerability Check

on:
  workflow_call:
    secrets:
      DISCORD_VULN:
        required: true

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        id: vulncheck
        run: govulncheck ./... 2>&1 | tee vulncheck-output.txt
        continue-on-error: true
      - name: Discord Alert
        if: steps.vulncheck.outcome == 'failure'
        run: |
          REPO_NAME="${{ github.repository }}"
          OUTPUT=$(head -c 1000 vulncheck-output.txt)
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{
                 \"embeds\": [{
                   \"title\": \"⚠️ Vulnerability found\",
                   \"description\": \"govulncheck found issues in \`${REPO_NAME}\`\",
                   \"color\": 15548997,
                   \"fields\": [
                     {\"name\": \"Output\", \"value\": \"\`\`\`\\n${OUTPUT}\\n\`\`\`\"}
                   ]
                 }]
               }" \
               "${{ secrets.DISCORD_VULN }}"
