name: Discord Merge Notification

on:
  workflow_call:
    secrets:
      DISCORD_WEBHOOK:
        required: true

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO_NAME="${{ github.repository }}"
          SOURCE_BRANCH="${{ github.event.pull_request.head.ref }}"
          TARGET_BRANCH="${{ github.event.pull_request.base.ref }}"
          MERGE_TIME="${{ github.event.pull_request.merged_at }}"

          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{
                 \"embeds\": [{
                   \"title\": \"✅ PR #${PR_NUMBER} merged\",
                   \"description\": \"**${PR_TITLE}**\",
                   \"url\": \"${PR_URL}\",
                   \"color\": 3066993,
                   \"fields\": [
                     {\"name\": \"Repository\", \"value\": \"\`${REPO_NAME}\`\", \"inline\": true},
                     {\"name\": \"Author\", \"value\": \"${PR_AUTHOR}\", \"inline\": true},
                     {\"name\": \"Branch\", \"value\": \"\`${SOURCE_BRANCH}\` → \`${TARGET_BRANCH}\`\", \"inline\": false}
                   ],
                   \"timestamp\": \"${MERGE_TIME}\"
                 }]
               }" \
               "$DISCORD_WEBHOOK"
